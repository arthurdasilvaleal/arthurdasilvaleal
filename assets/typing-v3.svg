<svg width="520" height="70" viewBox="0 0 520 70" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Apresentação animada</title>
  <desc id="desc">Desenvolvedor Web, apaixonado por tecnologia, games, código e criatividade</desc>
  <rect width="520" height="70" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="42" fill="#58a6ff" font-family="monospace" font-size="22">&gt;_</text>

  <text x="70" y="42" fill="#f0f6fc" font-family="monospace" font-size="20">Desenvolvedor Web
    <animate attributeName="opacity" values="1;1;0;0;0;0;0" keyTimes="0;.28;.30;.58;.60;.88;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="70" y="42" fill="#f0f6fc" font-family="monospace" font-size="20" opacity="0">Apaixonado por tecnologia
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;.28;.30;.58;.60;.88;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="70" y="42" fill="#f0f6fc" font-family="monospace" font-size="20" opacity="0">Games, código e criatividade
    <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;.28;.30;.58;.60;.88;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
  </text>

  <rect x="290" y="21" width="3" height="25" fill="#58a6ff">
    <animate attributeName="x" values="290;290;350;350;370;370;290" keyTimes="0;.28;.30;.58;.60;.88;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
