<svg width="520" height="70" viewBox="0 0 520 70" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Apresentação animada</title>
  <desc id="desc">Desenvolvedor web, apaixonado por tecnologia e games</desc>
  <rect width="520" height="70" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="42" fill="#58a6ff" font-family="monospace" font-size="22">&gt;_</text>
  <clipPath id="typing-mask">
    <rect x="70" y="18" width="0" height="30">
      <animate attributeName="width" values="0;220;220;0" keyTimes="0;0.55;0.78;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
  <text x="70" y="42" fill="#f0f6fc" font-family="monospace" font-size="20" clip-path="url(#typing-mask)">Desenvolvedor Web</text>
  <rect x="70" y="21" width="3" height="25" fill="#58a6ff">
    <animate attributeName="x" values="70;290;290;70" keyTimes="0;0.55;0.78;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
