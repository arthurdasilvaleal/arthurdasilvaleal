<svg width="520" height="70" viewBox="0 0 520 70" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Apresentação animada</title>
  <desc id="desc">Desenvolvedor web, apaixonado por tecnologia e games</desc>
  <rect width="520" height="70" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="42" fill="#58a6ff" font-family="monospace" font-size="22">&gt;_</text>
  <text x="70" y="42" fill="#f0f6fc" font-family="monospace" font-size="20">
    <tspan>Desenvolvedor Web</tspan>
    <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="70" y="42" fill="#f0f6fc" font-family="monospace" font-size="20" opacity="0">
    <tspan>Apaixonado por tecnologia</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="70" y="42" fill="#f0f6fc" font-family="monospace" font-size="20" opacity="0">
    <tspan>Games, código e criatividade</tspan>
    <animate attributeName="opacity" values="0;0;0;1;0" dur="6s" repeatCount="indefinite"/>
  </text>
  <rect x="475" y="21" width="3" height="25" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
